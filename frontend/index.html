<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIOBSIATM — Панель статуса пациентов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@500;600;700;800&family=Roboto+Condensed:wght@600;700&display=swap');
  :root{
    --blue-dark:#1d4fa8;
    --blue:#2f6fe0;
    --ink:#3c2826;
    --ink-soft:rgba(60,40,38,0.62);
    --ink-faint:rgba(60,40,38,0.15);
    --bg:#dae3ef;
    --present:#1d7a3e;
    --present-bg:#dcf3e3;
    --transit:#8a6d1e;
    --transit-bg:#fff3d6;
    --pink:#c23b73;
    --pink-dark:#9c2f5c;
    --font-heading:'Roboto Condensed', 'Roboto', sans-serif;
    --font-body:'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.55), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.35), transparent 40%),
      var(--bg);
    font-family: var(--font-body);
  }
  .clay-raised{
    background: rgba(255,255,255,0.62);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 24px 70px rgba(31,86,178,0.18), 0 2px 8px rgba(0,0,0,0.06);
  }
  .clay-raised-sm{
    box-shadow: 0 10px 26px rgba(31,86,178,0.12);
  }

  .page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding: clamp(12px, 4vw, 60px) clamp(10px, 3vw, 20px); }
  .board { width:100%; max-width:1440px; border-radius: clamp(18px, 3vw, 44px); padding: clamp(10px, 2vw, 22px); }
  .board-inner { background:rgba(255,255,255,0.86); border:1px solid rgba(255,255,255,0.7); border-radius: clamp(14px, 2.4vw, 32px); padding: clamp(16px, 3.2vw, 36px) clamp(14px, 3vw, 40px) clamp(14px, 3vw, 32px); overflow:hidden; }

  .board-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:14px; padding-bottom: clamp(14px, 2.5vw, 28px); }
  .brand { display:flex; align-items:center; gap: clamp(10px, 2vw, 18px); }
  .brand-icon { width: clamp(40px, 6vw, 58px); height: clamp(40px, 6vw, 58px); border-radius: clamp(12px, 2vw, 20px); background:linear-gradient(145deg, var(--blue), var(--blue-dark)); box-shadow:0 8px 20px rgba(31,86,178,0.4); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand-icon svg { width: clamp(20px, 3vw, 28px); height: clamp(20px, 3vw, 28px); }
  .brand-title { font-family: var(--font-heading); font-size: clamp(24px, 5.5vw, 46px); font-weight:700; color:var(--blue-dark); letter-spacing:0.5px; line-height:1.1; }
  .brand-sub { font-size: clamp(11px, 2vw, 21px); font-weight:700; color:var(--ink-soft); letter-spacing:1.2px; margin-top:2px; }
  .clock-wrap { display:flex; align-items:center; gap: clamp(12px, 2.5vw, 24px); }
  .clock-divider { width:1px; height: clamp(32px, 4.5vw, 44px); background:var(--ink-faint); border-radius:2px; }
  .clock-time { font-family: var(--font-heading); font-size: clamp(28px, 6.5vw, 52px); font-weight:700; color:var(--ink); letter-spacing:1px; line-height:1.1; }
  .clock-date { font-size: clamp(11px, 2vw, 21px); font-weight:600; color:var(--ink-soft); margin-top:2px; }

  .table-card { background:rgba(255,255,255,0.86); border:1px solid rgba(255,255,255,0.7); border-radius: clamp(16px, 2.4vw, 28px); overflow:hidden; margin-bottom:0; }
  .table-head { display:grid; grid-template-columns:2.7fr 3.2fr; justify-items:center; gap: clamp(8px, 2vw, 16px); padding: clamp(12px, 2.2vw, 22px) clamp(14px, 3vw, 32px); border-bottom:1px solid var(--ink-faint); }
  .table-head div { font-family: var(--font-heading); font-size: clamp(17px, 2.8vw, 27px); font-weight:700; letter-spacing:1px; color:var(--ink-soft); text-align:center; }

  .row { display:grid; grid-template-columns:2.7fr 3.2fr; align-items:center; justify-items:center; padding: clamp(16px, 2.6vw, 28px) clamp(14px, 3vw, 32px); background:rgba(255,255,255,0.86); border-top:1px solid var(--ink-faint); gap: clamp(8px, 2vw, 16px); }
  .row .name { font-family: var(--font-heading); font-size: clamp(20px, 3.6vw, 40px); font-weight:700; color:var(--ink); line-height:1.15; text-align:center; }
  .row .loc {
    display:inline-flex; align-items:center; justify-content:center; width:fit-content;
    font-size: clamp(17px, 2.6vw, 28px); font-weight:700;
    padding: clamp(7px, 1vw, 12px) clamp(16px, 2vw, 24px); border-radius:999px;
    color:var(--present); background:var(--present-bg);
  }
  .row .loc.transit { font-style: normal; color:var(--transit); background:var(--transit-bg); }

  #status-pill { position:fixed; bottom: max(12px, env(safe-area-inset-bottom)); right:12px; font:12px/1.4 var(--font-body); color:var(--ink-soft); background:rgba(255,255,255,0.86); border:1px solid rgba(255,255,255,0.7); padding:8px 14px; border-radius:14px; box-shadow:0 6px 16px rgba(31,86,178,0.12); max-width: calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status-pill.err { color:#b3261e; }
  #rows-viewport { overflow: hidden; }
  #rows-viewport::-webkit-scrollbar { display: none; }

  /* ---- Демо: кнопка "Поздравить" + попап поздравления ---- */
  #congrats-btn {
    position:fixed; bottom: max(12px, env(safe-area-inset-bottom)); left:12px; z-index:10;
    display:flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:14px; border:none; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:14px;
    color:var(--pink-dark); background:rgba(255,255,255,0.86);
    border:1px solid rgba(255,255,255,0.7); box-shadow:0 6px 16px rgba(31,86,178,0.12);
  }
  #congrats-btn:hover:not(:disabled) { box-shadow:0 8px 20px rgba(31,86,178,0.2); }
  #congrats-btn:disabled { opacity:0.6; cursor:default; }

  .congrats-overlay {
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(20,26,40,0.4);
    opacity:0; pointer-events:none; transition:opacity 0.35s ease;
  }
  .congrats-overlay.open { opacity:1; pointer-events:auto; }
  .congrats-card {
    position:relative; overflow:hidden;
    width:820px; max-width:95vw; border-radius:36px; background:#fff;
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 40px 100px rgba(31,86,178,0.25), 0 4px 16px rgba(0,0,0,0.08);
    padding:68px 60px 56px; text-align:center; box-sizing:border-box;
    transform:scale(0.92) translateY(10px);
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1);
    --accent:var(--blue-dark); --accent-bg:#e7edfa;
  }
  .congrats-overlay.open .congrats-card { transform:scale(1) translateY(0); }
  .congrats-card.girl { --accent:var(--pink-dark); --accent-bg:#faeaf1; }
  .congrats-confetti { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .congrats-confetti span {
    position:absolute; top:-24px; width:9px; height:15px; border-radius:2px; opacity:0.95;
    animation: congrats-fall linear forwards;
  }
  @keyframes congrats-fall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    85% { opacity:1; }
    100% { transform:translateY(480px) rotate(600deg); opacity:0; }
  }
  .congrats-eyebrow {
    position:relative; z-index:2;
    font-size:clamp(22px,3vw,30px); font-weight:700; letter-spacing:3px; text-transform:uppercase;
    color:var(--accent);
  }
  .congrats-patient {
    position:relative; z-index:2;
    font-family:var(--font-heading); font-weight:700; font-size:clamp(24px,3.2vw,32px); color:var(--ink); margin-top:18px;
  }
  .congrats-word {
    position:relative; z-index:2;
    font-family:var(--font-heading); font-weight:700; font-size:clamp(84px,13vw,140px);
    color:var(--accent); line-height:1; margin:34px 0 14px;
    animation: congrats-pop 0.6s cubic-bezier(.2,.8,.2,1) 0.1s both;
  }
  @keyframes congrats-pop {
    0% { transform:scale(0.4) rotate(-4deg); opacity:0; }
    55% { transform:scale(1.14) rotate(2deg); opacity:1; }
    80% { transform:scale(0.97) rotate(-1deg); }
    100% { transform:scale(1) rotate(0deg); }
  }
  .congrats-voice {
    position:relative; z-index:2;
    display:inline-flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:700; color:var(--accent);
    background:var(--accent-bg); padding:7px 16px; border-radius:999px;
    min-height:16px;
  }
  .congrats-demo-tag {
    position:absolute; top:18px; right:20px; z-index:3;
    font-size:11px; font-weight:700; letter-spacing:1px;
    color:var(--ink-soft); background:var(--ink-faint);
    padding:4px 10px; border-radius:999px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="board clay-raised">
    <div class="board-inner">

      <div class="board-header">
        <div class="brand">
          <div class="brand-icon clay-raised-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path><circle cx="9" cy="15" r="1.5" fill="white" stroke="none"></circle><path d="M13 14h5M13 17h5"></path></svg>
          </div>
          <div>
            <div class="brand-title">RIOBSIATM</div>
            <div class="brand-sub">ПАНЕЛЬ СТАТУСА ПАЦИЕНТОВ</div>
          </div>
        </div>
        <div class="clock-wrap">
          <div class="clock-divider"></div>
          <div style="text-align:right;">
            <div id="clock-time" class="clock-time">--:--:--</div>
            <div id="clock-date" class="clock-date">—</div>
          </div>
        </div>
      </div>

      <div class="table-card clay-raised-sm">
        <div class="table-head">
          <div>ИМЯ</div>
          <div>РАСПОЛОЖЕНИЕ</div>
        </div>
        <div id="rows-viewport">
          <div id="rows"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="status-pill">Подключение…</div>

<button id="congrats-btn" title="Демо: поздравить случайную пациентку">🎉 Поздравить</button>

<div class="congrats-overlay" id="congratsOverlay">
  <div class="congrats-card" id="congratsCard">
    <div class="congrats-confetti" id="congratsConfetti"></div>
    <div class="congrats-demo-tag">ДЕМО</div>
    <div class="congrats-eyebrow">Поздравляем!</div>
    <div class="congrats-patient" id="congratsPatient">—</div>
    <div class="congrats-word" id="congratsWord">—</div>
    <div class="congrats-voice" id="congratsVoice">&nbsp;</div>
  </div>
</div>

<script>
  // Point this at your backend (see backend/README). Same-origin by default;
  // override by opening this file as index.html?api=https://your-host or editing below.
  const params = new URLSearchParams(location.search);
  const API_BASE = params.get('api') || 'https://dashboard-3thb.onrender.com';
  const POLL_MS = 5000;

  const rowsEl = document.getElementById('rows');
  const viewportEl = document.getElementById('rows-viewport');
  const statusEl = document.getElementById('status-pill');
  const clockTimeEl = document.getElementById('clock-time');
  const clockDateEl = document.getElementById('clock-date');

  // ── Auto-scroll for long patient lists ──────────────────────────────────
  // Shows N rows at a time (fewer on narrow/phone screens so the whole card
  // still fits reasonably), then slowly scrolls through the rest: pause at
  // top → scroll down → pause at bottom → scroll back up → repeat.
  function visibleRowsForViewport() {
    return window.innerWidth < 640 ? 4 : 6;
  }
  const SCROLL_SPEED_PX_PER_SEC = 40; // readable scroll speed, independent of frame rate
  const PAUSE_MS = 3000;              // dwell time at top and bottom

  let scrollState = 'top-pause';
  let stateUntil = Date.now() + PAUSE_MS;
  // Browsers round scrollTop to whole pixels on every read/write, so
  // accumulating a sub-pixel-per-frame amount directly on scrollTop loses
  // the fractional part each time and the scroll never visibly moves.
  // Track the real (float) position ourselves and only round on write.
  let scrollPos = 0;
  let lastFrameTs = null;

  function sizeViewport() {
    const rows = Array.from(rowsEl.querySelectorAll('.row'));
    if (rows.length === 0) { viewportEl.style.maxHeight = ''; return; }
    // Rows have variable height (names can wrap to 2-3 lines), so measure
    // actual rendered geometry up through the Nth row rather than assuming
    // a uniform row height — otherwise a tall row gets cut off mid-text.
    const count = Math.min(visibleRowsForViewport(), rows.length);
    const viewportTop = viewportEl.getBoundingClientRect().top;
    const lastRowBottom = rows[count - 1].getBoundingClientRect().bottom;
    viewportEl.style.maxHeight = Math.round(lastRowBottom - viewportTop) + 'px';
  }

  let resizeDebounce = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    // Recompute after layout settles (fonts/columns reflow via CSS clamp()
    // on rotation or window resize) — resets the scroll cycle too, since
    // the row count shown per "page" can change between phone/desktop widths.
    resizeDebounce = setTimeout(() => {
      viewportEl.scrollTop = 0;
      scrollPos = 0;
      scrollState = 'top-pause';
      stateUntil = Date.now() + PAUSE_MS;
      sizeViewport();
    }, 200);
  });

  function autoScrollTick(ts) {
    requestAnimationFrame(autoScrollTick);
    if (lastFrameTs === null) lastFrameTs = ts;
    const dtSec = Math.min(0.25, (ts - lastFrameTs) / 1000); // clamp in case of tab-switch pauses
    lastFrameTs = ts;

    const maxScroll = viewportEl.scrollHeight - viewportEl.clientHeight;
    if (maxScroll <= 2) return; // everything fits — nothing to scroll

    const now = Date.now();
    if (scrollState === 'top-pause') {
      if (now >= stateUntil) { scrollPos = viewportEl.scrollTop; scrollState = 'scrolling-down'; }
      return;
    }
    if (scrollState === 'bottom-pause') {
      if (now >= stateUntil) { scrollPos = viewportEl.scrollTop; scrollState = 'scrolling-up'; }
      return;
    }
    if (scrollState === 'scrolling-down') {
      scrollPos = Math.min(maxScroll, scrollPos + SCROLL_SPEED_PX_PER_SEC * dtSec);
      viewportEl.scrollTop = Math.round(scrollPos);
      if (scrollPos >= maxScroll - 0.5) {
        scrollPos = maxScroll;
        viewportEl.scrollTop = maxScroll;
        scrollState = 'bottom-pause';
        stateUntil = now + PAUSE_MS;
      }
      return;
    }
    if (scrollState === 'scrolling-up') {
      scrollPos = Math.max(0, scrollPos - SCROLL_SPEED_PX_PER_SEC * dtSec);
      viewportEl.scrollTop = Math.round(scrollPos);
      if (scrollPos <= 0.5) {
        scrollPos = 0;
        viewportEl.scrollTop = 0;
        scrollState = 'top-pause';
        stateUntil = now + PAUSE_MS;
      }
    }
  }
  requestAnimationFrame(autoScrollTick);

  const WEEKDAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  // Local clock, ticked every second; resynced to the server periodically.
  let clockOffsetMs = 0; // serverNow - clientNow

  function renderClock() {
    const now = new Date(Date.now() + clockOffsetMs);
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    clockTimeEl.textContent = `${hh}:${mm}:${ss}`;
    clockDateEl.textContent = `${WEEKDAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()} г.`;
  }
  setInterval(renderClock, 1000);
  renderClock();

  async function syncServerTime() {
    try {
      const res = await fetch(`${API_BASE}/api/server-time`);
      if (!res.ok) return;
      const data = await res.json();
      clockOffsetMs = new Date(data.iso).getTime() - Date.now();
    } catch (e) { /* keep local clock if this fails */ }
  }



  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  let lastPatientsJson = null;
  let currentPatients = []; // latest fetched list — read by the "Поздравить" demo below

  function renderPatients(patients) {
    rowsEl.innerHTML = patients.map(p => `
      <div class="row">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="loc${p.is_transit ? ' transit' : ''}">${escapeHtml(p.location)}</div>
      </div>
    `).join('');
    // Reset scroll position and re-measure row height whenever the list changes
    // (patient count, or even just longer text, can change the row/total height).
    viewportEl.scrollTop = 0;
    scrollPos = 0;
    scrollState = 'top-pause';
    stateUntil = Date.now() + PAUSE_MS;
    sizeViewport();
  }

  async function refresh() {
    try {
      const res = await fetch(`${API_BASE}/api/patients`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const patients = await res.json();
      currentPatients = patients;
      // Only re-render (and reset the auto-scroll cycle) when the data
      // actually changed — otherwise every 5s poll would restart the
      // scroll animation before it ever reaches the bottom of a long list.
      const json = JSON.stringify(patients);
      if (json !== lastPatientsJson) {
        lastPatientsJson = json;
        renderPatients(patients);
      }
      statusEl.textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU');
      statusEl.classList.remove('err');
    } catch (e) {
      statusEl.textContent = 'Нет связи с сервером — повтор через ' + (POLL_MS / 1000) + ' с';
      statusEl.classList.add('err');
    }
  }

  async function refreshImportStatus() {
    try {
      const res = await fetch(`${API_BASE}/api/import/status`);
      if (!res.ok) return;
      const logs = await res.json();
      const lastOk = logs.find(l => l.status === 'ok');
      if (lastOk) {
        const when = new Date(lastOk.imported_at).toLocaleString('ru-RU');
        statusEl.title = `Последний импорт из CSV: ${lastOk.filename} (${lastOk.row_count} записей) — ${when}`;
      }
    } catch (e) { /* not critical, ignore */ }
  }

  syncServerTime();
  refresh();
  refreshImportStatus();
  setInterval(refresh, POLL_MS);
  setInterval(syncServerTime, 5 * 60 * 1000);
  setInterval(refreshImportStatus, 60 * 1000);

  // ── Демо: кнопка "Поздравить" ────────────────────────────────────────────
  // ВРЕМЕННО берёт имя из реального списка пациентов (currentPatients,
  // обновляется в refresh() выше). Пол ребёнка и сам факт родов при этом
  // ПОЛНОСТЬЮ выдуманы случайным образом — это ещё не привязано к реальному
  // статусу "пациентка в родзале". Как только появится реальная проверка
  // (кто действительно в родах) — обязательно ограничить выбор только ими,
  // иначе табло будет "поздравлять" случайных пациентов на рентгене/УЗИ.
  // На попапе оставлена пометка "ДЕМО", пока этой проверки нет.
  (function () {
    const FALLBACK_NAMES = ['Иванова Анна Сергеевна', 'Смирнова Ольга Дмитриевна']; // на случай, если список ещё не загрузился

    const VOICES = {
      boy:  { uz: 'uz-sardor',  ru: 'ru-dmitry'   },
      girl: { uz: 'uz-madina',  ru: 'ru-svetlana' },
    };

    function buildTexts(name, gender) {
      return gender === 'boy'
        ? {
            ru: `Поздравляем! У пациентки ${name} родился мальчик.`,
            uz: `Tabriklaymiz! ${name} bemorimizning o'g'il farzandi dunyoga keldi.`,
          }
        : {
            ru: `Поздравляем! У пациентки ${name} родилась девочка.`,
            uz: `Tabriklaymiz! ${name} bemorimizning qiz farzandi dunyoga keldi.`,
          };
    }

    const btn = document.getElementById('congrats-btn');
    const overlay = document.getElementById('congratsOverlay');
    const card = document.getElementById('congratsCard');
    const patientEl = document.getElementById('congratsPatient');
    const wordEl = document.getElementById('congratsWord');
    const voiceEl = document.getElementById('congratsVoice');
    const confettiEl = document.getElementById('congratsConfetti');
    const audioEl = new Audio();

    function buildConfetti() {
      const colors = ['#c23b73', '#2f6fe0', '#1d7a3e', '#e0a92f', '#8a3fc2'];
      confettiEl.innerHTML = '';
      for (let i = 0; i < 30; i++) {
        const s = document.createElement('span');
        s.style.left = (Math.random() * 100) + '%';
        s.style.background = colors[i % colors.length];
        s.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
        s.style.animationDelay = (Math.random() * 0.5) + 's';
        s.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
        if (Math.random() > 0.5) s.style.borderRadius = '50%';
        confettiEl.appendChild(s);
      }
    }

    // Озвучка не должна ронять демо, если бэкенд/сеть подведут — просто
    // тихо переходим дальше без звука.
    function playTTS(text, voiceKey) {
      return new Promise((resolve) => {
        const url = `${API_BASE}/api/tts?text=${encodeURIComponent(text)}&voice=${voiceKey}`;
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        audioEl.onended = finish;
        audioEl.onerror = finish;
        audioEl.src = url;
        audioEl.play().catch(finish);
        setTimeout(finish, 8000); // страховка, если событие ended не пришло
      });
    }

    async function runCongrats() {
      btn.disabled = true;
      try {
        const pool = currentPatients.length ? currentPatients.map(p => p.name) : FALLBACK_NAMES;
        const name = pool[Math.floor(Math.random() * pool.length)];
        const gender = Math.random() < 0.5 ? 'boy' : 'girl';
        const texts = buildTexts(name, gender);

        card.classList.toggle('girl', gender === 'girl');
        patientEl.textContent = 'У пациентки ' + name;
        wordEl.style.animation = 'none';
        wordEl.textContent = gender === 'boy' ? 'Мальчик' : 'Девочка';
        void wordEl.offsetWidth;
        wordEl.style.animation = '';
        voiceEl.textContent = '🔊 O‘zbekcha…';
        buildConfetti();
        overlay.classList.add('open');

        await playTTS(texts.uz, VOICES[gender].uz);
        voiceEl.textContent = '🔊 По-русски…';
        await playTTS(texts.ru, VOICES[gender].ru);

        voiceEl.textContent = ' ';
        setTimeout(() => overlay.classList.remove('open'), 1200);
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', runCongrats);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  })();
</script>

</body>
</html>
